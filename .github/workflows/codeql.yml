name: CodeQL
run-name: >-
  ${{ github.event_name == 'pull_request' &&
      format('🔎 CodeQL - {0} → {1} by {2}', github.head_ref, github.base_ref, github.actor) ||
      format('🔎 CodeQL - {0} - {1} by {2}', github.event_name, github.ref_name, github.actor) }}

# Replaces GitHub's "default setup" for code scanning. The default setup analyzes C# with
# build-mode "none" on a Linux runner without the MAUI workloads, so the Android, Apple,
# Windows and Bluetooth.Maui projects fail to restore and are extracted with unresolved
# types ("Low C# analysis quality"). Here C# is built for real on Windows, with the same
# SDK and workload steps as ci.yml, so every target framework is compiled and extracted.
#
# Do NOT add `paths-ignore` to the pull_request trigger: the `main` ruleset requires CodeQL
# results on every PR, and a skipped run would block merges.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '41 6 * * 3' # weekly, catches new queries on unchanged code
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }} # a newer push to main must not cancel the scan of the previous commit

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
  SOLUTION_PATH: 'Bluetooth.Packages.slnx' # keep in sync with ci.yml

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 30
    permissions:
      security-events: write # upload results
      contents: read
      actions: read
      packages: read
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
            runs-on: ubuntu-latest
          - language: csharp
            build-mode: manual
            runs-on: windows-latest # the only OS that can compile the Windows target
    steps:
      - name: '🔄 Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: '🔧 Setup .NET'
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: '📲 Install .NET MAUI workloads'
        if: matrix.language == 'csharp'
        run: dotnet workload restore "$SOLUTION_PATH"

      - name: '🔎 Initialize CodeQL'
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended # the default suite plus lower-severity and lower-precision security queries

      # CodeQL traces the compiler, so the build must really compile everything:
      # --no-incremental (no skipped projects) and no shared compilation server.
      - name: '🔨 Build'
        if: matrix.build-mode == 'manual'
        run: >-
          dotnet build "$SOLUTION_PATH"
          --configuration Release
          --no-incremental
          -p:UseSharedCompilation=false

      - name: '🔎 Analyze'
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: '/language:${{ matrix.language }}' # same category as the default setup, so alert history carries over
